#version=RHEL9

# ---- Install source ----
# When booted from the ISO itself, cdrom is correct.
cdrom

# ---- Language / keyboard / timezone ----
lang en_US.UTF-8
keyboard --xlayouts='fr'
timezone Africa/Tunis --utc

# ---- Network ----
network --bootproto=dhcp --device=link --activate --onboot=on --hostname=custom-hostname

# ---- Root & user accounts ----
# CHANGE THESE PASSWORDS before building the ISO.
rootpw --plaintext ChangeMe123!
user --name=admin --groups=wheel --plaintext --password=ChangeMe123!

# ---- Disk partitioning ----
# Wipes the target disk and creates separate /boot, /, swap, and /home.
zerombr
clearpart --all --initlabel
part /boot/efi --fstype=efi --size=200 --grow --maxsize=600
part /boot --fstype=xfs --size=1024
part /     --fstype=xfs --size=20480
part swap  --size=4096
part /home --fstype=xfs --size=1 --grow

# ---- Bootloader ----
bootloader --location=mbr

# ---- Misc install behavior ----
firstboot --disable
eula --agreed
reboot

# ---- Packages ----
%packages
@^server-product-environment
nginx
openssh-server
tmux
%end

# ---- Post-install: enable services ----
%post
systemctl enable nginx
systemctl enable sshd
%end